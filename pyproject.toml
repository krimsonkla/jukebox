[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jukebox"
version = "0.0.1"
description = "Build Spotify playlists from published record charts, driven by chat."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["spotify", "billboard", "playlists", "charts", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "dishka>=1.4,<2",
    "fastmcp>=3.2,<4",
    "lxml>=5.2,<7",
    "rapidfuzz>=3.9,<4",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.25",
    "respx>=0.21,<1",
    "pylint>=3",
    "black>=24",
]

[project.scripts]
jukebox = "jukebox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=jukebox --cov-report=term-missing --cov-fail-under=100 -m 'not network'"
markers = ["network: reaches a live external API; deselected by default, run deliberately"]

[tool.coverage.run]
source = ["jukebox"]
branch = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pylint.main]
load-plugins = ["pylint.extensions.mccabe"]
# A test's name is its sentence; a docstring restating it is noise, not documentation.
# Modules and public units still require one, enforced by the conventions test.
no-docstring-rgx = "^(test_|_)"

[tool.pylint.design]
max-complexity = 8
# The Definition of Done requires every unit to be single-purpose, which yields
# classes with one public method — a mapper maps, a source fetches. Demanding two
# would reward merging responsibilities. This lowers a floor; it raises no limit.
min-public-methods = 1

[tool.pylint.format]
max-line-length = 100
