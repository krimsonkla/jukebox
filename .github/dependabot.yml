# Dependabot opens pull requests when a dependency moves. Nothing merges on its
# own: every pull request runs the same gated workflow as any other change.
version: 2

updates:
  # Runtime and test dependencies. uv.lock is what CI installs from, so an
  # update that does not also update the lock file is not an update.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request for the test toolchain rather than one per tool.
      dev:
        dependency-type: development

  # The workflow pins each action to a commit SHA, which is what stops a tag
  # being repointed under us. Dependabot reads the version comment beside the
  # SHA and proposes the next one, so pinning costs no staleness.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
